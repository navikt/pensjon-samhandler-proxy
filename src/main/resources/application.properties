spring.application.name=pensjon-samhandler-proxy

# Leser secrets montert av nais (fra Vault) som en configtree.
# /secrets/srvpenmq/{username,password} -> srvpenmq.username / srvpenmq.password
# /secrets/srvtss/{username,password}   -> srvtss.username / srvtss.password
# "optional:" gjør kun at selve configtree-importen ikke feiler oppstart dersom
# /secrets mangler (f.eks. lokalt/i test). Properties som er påkrevd andre steder
# (f.eks. tss.samhandlerv2.serviceuser.*) må uansett settes på annen måte i de
# miljøene, ellers feiler oppstart som normalt pga. manglende placeholder-verdi.
spring.config.import=optional:configtree:/secrets/

spring.jms.template.default-destination=${samhandler.xml.queueName}
spring.jms.template.receive-timeout=10000ms

spring.main.banner-mode=off

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_OPENID_CONFIG_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_APP_CLIENT_ID}

tss.samhandlerv2.serviceuser.username=${srvtss.username}
tss.samhandlerv2.serviceuser.password=${srvtss.password}
